# Minimal service configuration for the ReMe retrieval-only baseline.
# It intentionally does not declare as_llm or embedding_store, so BM25 runs
# without API credentials and without embedding backfill.
service:
  backend: http
  web_enabled: false
jobs:
  health_check:
    backend: base
    enable_serve: true
    steps:
      - backend: health_check_step
  reindex:
    backend: base
    enable_serve: true
    watch_dirs: [daily_dir, digest_dir, resource_dir]
    watch_suffixes: [md, jsonl]
    steps:
      - backend: clear_store_step
      - backend: init_changes_step
        monitor_type: file_store
        monitor_name: default
        dispatch_steps: [update_index_step]
  search:
    backend: base
    enable_serve: true
    steps:
      - backend: search_step
        vector_weight: 0.0
        candidate_multiplier: 5.0
        expand_links: false
components:
  tokenizer:
    default:
      backend: regex
  file_graph:
    default:
      backend: local
  keyword_index:
    default:
      backend: bm25
      tokenizer: default
  file_store:
    default:
      backend: local
      embedding_store: ""
      keyword_index: default
      file_graph: default
  file_chunker:
    markdown:
      backend: markdown
      supported_extensions: [md]
      embed_toc: true
      max_ast_sections: 100
      include_frontmatter_in_metadata: false
      include_frontmatter_keys_in_metadata: []
